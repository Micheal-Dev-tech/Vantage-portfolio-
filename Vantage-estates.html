<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantage Estates | Premium Properties</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">

    <header class="bg-slate-900 text-white py-16 px-6 text-center">
        <h1 class="text-4xl font-bold">Find Your Dream Home</h1>
        <p class="text-slate-400 mt-2">Premium Real Estate across Lagos & Abuja</p>
        
        <div class="mt-8 max-w-md mx-auto bg-white p-2 rounded-lg flex shadow-lg">
            <input type="text" placeholder="Location (e.g. Lekki Phase 1)" class="w-full px-4 py-2 text-slate-800 outline-none">
            <button class="bg-blue-600 px-6 py-2 rounded-md font-bold">Search</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="bg-white rounded-xl overflow-hidden shadow-md border border-slate-200">
            <div class="h-48 bg-slate-300 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=500')"></div>
            <div class="p-4">
                <span class="text-blue-600 font-bold text-xs">FOR SALE</span>
                <h3 class="text-lg font-bold mt-1">5 Bedroom Fully Detached Duplex</h3>
                <p class="text-slate-500 text-sm italic">Lekki County Homes, Lagos</p>
                <div class="flex justify-between mt-4 text-slate-700 font-semibold">
                    <span>₦250,000,000</span>
                    <span class="text-sm">5 Bed | 6 Bath</span>
                </div>
                <button class="w-full mt-4 bg-slate-900 text-white py-2 rounded-lg hover:bg-blue-600 transition">Book Inspection</button>
            </div>
        </div>

        </main>

</body>
</html>
